            gap: 16px;

            color: var(--color-warning);

            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.25);

            line-height: 1.7;

            background: var(--color-bg-1);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;

        .impact-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .impact-list {
            list-style: none;
            padding-left: 0;
        }

        .impact-list li {
            padding: 4px 0;
            font-size: 14px;
            color: var(--color-text);
        }

        .impact-list li::before {
            content: "→ ";
            color: var(--color-primary);
            font-weight: bold;
            margin-right: 8px;
        }

            display: inline-block;
            background: var(--color-bg-4);
            color: var(--color-error);

            border-radius: 4px;
            font-weight: 600;

                impacts: [
                    "Private conversations indexed by Google",
                    "User prompts exposed in search results",
                    "URLs with conversation fragments publicly accessible",
                    "Privacy expectations violated"
                ],
                sources: [
                    "https://www.hindustantimes.com/technology/chatgpt-private-chats-leaked-on-google-search-heres-what-you-should-know-101731392867693.html",
                    "https://www.newindianexpress.com/xplore/2025/Apr/08/chatgpt-raises-alarm-after-leaking-personal-data-instead-of-memories"
                ]
            },
            {
                title: "AgentFlayer Indirect Prompt Injection",
                date: "2024",
                severity: "high",
                category: ["vulnerability", "zero-click"],
                company: "ChatGPT with Connectors",
                cost: "Security research disclosure",
                affected: "Users with connected platforms",
                description: "Security researchers demonstrated ChatGPT's Connectors feature could be exploited through indirect prompt injection to extract sensitive data from connected platforms like Google Drive. Zero-click attack required only victim's email address.",
                impacts: [
                    "Zero-click data extraction (email address only)",
                    "Developer secrets and API keys exposed",
                    "Google Drive data accessible to attackers",
                    "No user interaction required for compromise"
                ],
                sources: [
                    "https://www.wired.com/story/chatgpt-prompt-injection-attack-security/",
                    "https://arxiv.org/abs/2312.12351"
                ]
            }
        ];

        let currentFilter = 'all';
        let searchTerm = '';

        function renderIncidents() {
            const container = document.getElementById('incidentsContainer');
            const noResults = document.getElementById('noResults');
            
            const filtered = incidents.filter(incident => {
                const matchesFilter = currentFilter === 'all' || 
                    incident.severity === currentFilter || 
                    incident.category.includes(currentFilter);
                
                const matchesSearch = searchTerm === '' || 
                    incident.title.toLowerCase().includes(searchTerm) ||
                    incident.company.toLowerCase().includes(searchTerm) ||
                    incident.description.toLowerCase().includes(searchTerm) ||
                    incident.category.some(cat => cat.toLowerCase().includes(searchTerm));
                
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            container.style.display = 'grid';
            noResults.style.display = 'none';

            container.innerHTML = filtered.map(incident => `
                <div class="incident-card">
                    <div class="incident-header">
                        <h3 class="incident-title">${incident.title}</h3>
                        <span class="severity-badge severity-${incident.severity}">
                            ${incident.severity.toUpperCase()}
                        </span>
                    </div>
                    
                    <div class="incident-meta">
                        <div class="meta-item">
                            <span class="meta-icon">📅</span>
                            <span>${incident.date}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-icon">🏢</span>
                            <span>${incident.company}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-icon">💰</span>
                            <span class="cost-highlight">${incident.cost}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-icon">👥</span>
                            <span>${incident.affected}</span>
                        </div>
                    </div>
                    
                    <p class="incident-description">${incident.description}</p>
                    
                    <div class="impact-section">
                        <div class="impact-title">Key Impacts & Consequences</div>
                        <ul class="impact-list">
                            ${incident.impacts.map(impact => `<li>${impact}</li>`).join('')}
                        </ul>
                    </div>
                    
                    <div class="tags">
                        ${incident.category.map(cat => `<span class="tag">${cat}</span>`).join('')}
                    </div>
                    
                    ${incident.sources ? `
                        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--color-border);">
                            <div style="font-size: 12px; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 8px;">📚 Reference Links:</div>
                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                ${incident.sources.map((source, idx) => `
                                    <a href="${source}" target="_blank" rel="noopener noreferrer" 
                                       style="font-size: 12px; color: var(--color-primary); text-decoration: none; display: flex; align-items: center; gap: 6px;">
                                        <span style="font-weight: 600;">[${idx + 1}]</span>
                                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${source}</span>
                                        <span style="font-size: 10px;">↗</span>
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderIncidents();
            });
        });

        // Search functionality
        const searchBox = document.getElementById('searchBox');
        searchBox.addEventListener('input', function() {
            searchTerm = this.value.toLowerCase();
            renderIncidents();
        });

        // Initial render
        renderIncidents();
    </script>
</body>
</html>
